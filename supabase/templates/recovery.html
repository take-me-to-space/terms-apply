<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password — Terms Apply</title>
  </head>
  <body
    style="
      margin: 0;
      background: #faf9f6;
      color: #242622;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table role="presentation" style="width: 100%; border-collapse: collapse">
      <tr>
        <td style="padding: 32px 20px">
          <table
            role="presentation"
            style="
              width: 100%;
              max-width: 520px;
              margin: auto;
              border-collapse: collapse;
            "
          >
            <tr>
              <td
                style="
                  padding-bottom: 22px;
                  border-bottom: 2px solid #b63024;
                  font-size: 26px;
                  font-weight: bold;
                  letter-spacing: -1px;
                "
              >
                terms apply<span style="color: #b63024">.</span>
              </td>
            </tr>
            <tr>
              <td style="padding-top: 28px">
                <h1 style="font-size: 26px; line-height: 1.2; margin: 0 0 18px">
                  Reset your password
                </h1>
                <p style="font-size: 16px; line-height: 1.65; margin: 0 0 24px">
                  Use this link to choose a new password. Open it in the browser
                  where you requested the reset.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    padding: 13px 18px;
                    background: #242622;
                    color: #faf9f6;
                    text-decoration: none;
                    font-size: 15px;
                    font-weight: bold;
                  "
                  >Set a new password →</a
                >
                <p
                  style="
                    font-size: 13px;
                    line-height: 1.65;
                    color: #64655d;
                    margin: 24px 0 28px;
                  "
                >
                  If you didn’t request a reset, you can ignore this email. Your
                  password stays the same.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  border-top: 1px solid #d6d5cc;
                  padding-top: 18px;
                  font-size: 12px;
                  line-height: 1.7;
                  color: #64655d;
                "
              >
                Terms Apply · Password recovery
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
