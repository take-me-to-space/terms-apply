# Local development only. Hosted projects are configured through Supabase settings.
project_id = "terms-apply"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
sql_paths = []
[realtime]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = true
port = 54324
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth**", "http://127.0.0.1:5173/reset-password", "http://localhost:5173/auth**", "http://localhost:5173/reset-password", "http://127.0.0.1:5174/auth**", "http://127.0.0.1:5174/reset-password"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"
[auth.rate_limit]
email_sent = 100
[edge_runtime]
enabled = false
[analytics]
enabled = false
