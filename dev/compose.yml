# Disposable integration services; credentials are generated in memory.
name: terms-apply-local
services:
  db:
    image: postgres:17-alpine
    container_name: supabase_db_terms-apply
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?generated by test script}
    ports: ['127.0.0.1:54322:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -h 127.0.0.1']
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: axllent/mailpit:v1.22.3
    ports: ['127.0.0.1:54324:8025']
  auth:
    image: supabase/gotrue:v2.186.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:5174
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:5174/auth**,http://127.0.0.1:5174/reset-password
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_DB_PASSWORD}@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: auth@example.com
      GOTRUE_SMTP_SENDER_NAME: Terms Apply local test
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 100
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
  rest:
    image: postgrest/postgrest:v14.4
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
  gateway:
    image: kong:2.8.1
    ports: ['127.0.0.1:54321:8000']
    depends_on: [auth, rest]
    volumes:
      - ./kong.yml:/kong.yml:ro
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 'off'
      KONG_LOG_LEVEL: error
