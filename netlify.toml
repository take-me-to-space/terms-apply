[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
  # Public project/app URLs, product ID and support contact. Keep credentials scanned.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,APP_URL,DODO_PRODUCT_ID,VITE_SUPPORT_EMAIL"
[functions]
  node_bundler = "esbuild"
[functions."billing-reconcile"]
  schedule = "*/5 * * * *"
[functions."reminders"]
  schedule = "*/5 * * * *"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms; style-src 'self'; font-src 'self'; img-src 'self' data: https://*.clarity.ms https://clarity.ms; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.clarity.ms https://clarity.ms https://c.bing.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
